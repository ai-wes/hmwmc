name: Regression checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hmwmc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy sympy websockets
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Run contract and end-to-end smoke checks
        run: bash scripts/run_ci_checks.sh
